# pnpm project settings (https://pnpm.io/settings). pnpm 11+ reads build-script
# approval from here; package.json `pnpm.onlyBuiltDependencies` stays for the
# older pnpm Vercel may pick from the lockfile version.

allowBuilds:
  sharp: true
  esbuild: true
  # Optional native accelerators for ws; the JS fallback is fine.
  bufferutil: false
  utf-8-validate: false
  # Postinstall only prints a funding message.
  core-js: false
  # Postinstall only checks versions.
  protobufjs: false

# Ported from sas-site. `@payloadcms/drizzle`: a virtual field (the Rich text
# block's write-only `markdown` sibling) must not fail the "identical block"
# check, or a block used both at the top level and inside a Section gets a
# second, suffixed table (`<table>_2`).
#
# pnpm 10 reads `pnpm.patchedDependencies` in package.json and writes each
# lockfile entry as `{ hash, path }`; pnpm 12 reads this file and rewrites
# those entries to a bare hash, which pnpm 10 then refuses:
#
#   ERR_PNPM_LOCKFILE_CONFIG_MISMATCH  Cannot proceed with the frozen
#   installation. The current "patchedDependencies" configuration doesn't
#   match the value found in the lockfile
#
# That failed every Vercel preview twice. `package.json#packageManager` now
# pins pnpm 10.28.0, so Vercel and a corepack shell agree. Install with
# `corepack pnpm install`, not a global pnpm 12: only pnpm 10 may write this
# lockfile. If the entries come back as bare hashes anyway, put the
# `{ hash, path }` form back before pushing.
patchedDependencies:
  '@payloadcms/drizzle': patches/@payloadcms__drizzle.patch
  '@payloadcms/plugin-mcp': patches/@payloadcms__plugin-mcp.patch
