# pnpm project settings (https://pnpm.io/settings). pnpm 11+ reads build-script
# approval from here; package.json `pnpm.onlyBuiltDependencies` stays for the
# older pnpm Vercel may pick from the lockfile version.

allowBuilds:
  sharp: true
  esbuild: true
  # Optional native accelerators for ws; the JS fallback is fine.
  bufferutil: false
  utf-8-validate: false
  # Postinstall only prints a funding message.
  core-js: false
  # Postinstall only checks versions.
  protobufjs: false

# Ported from sas-site. `@payloadcms/drizzle`: a virtual field (the Rich text
# block's write-only `markdown` sibling) must not fail the "identical block"
# check, or a block used both at the top level and inside a Section gets a
# second, suffixed table (`<table>_2`).
# Vercel installs with pnpm 10, which reads `pnpm.patchedDependencies` in
# package.json and wants the lockfile entry as `{ hash, path }`; pnpm 12
# reads it here and accepts that form. If a local pnpm rewrites the lockfile
# entry to a bare hash, put the object form back before pushing.
patchedDependencies:
  '@payloadcms/drizzle': patches/@payloadcms__drizzle.patch
